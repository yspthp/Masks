<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 智慧動態縮放與彩色粒子面具</title>
    <style>
        body { margin: 0; background-color: #050508; overflow: hidden; color: white; font-family: sans-serif; }
        
        #input_video { display: none; }
        
        #output_canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: -1; 
            transform: scaleX(-1); 
        }

        #webgl-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
            pointer-events: none; 
            transform: scaleX(-1); 
        }

        #status { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            padding: 10px; 
            background: rgba(0,0,0,0.6); 
            border-left: 3px solid #00ffcc; 
            font-size: 14px; 
            letter-spacing: 1px; 
            z-index: 10; 
            backdrop-filter: blur(5px); 
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="status">INITIALIZING // 載入動態縮放與景深虛化引擎...</div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    <div id="webgl-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');
        const container = document.getElementById('webgl-container');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        let particleSystem = null;
        const clock = new THREE.Clock();
        const loader = new GLTFLoader();
        
        loader.load('./model.glb', (gltf) => {
            let targetMesh = null;
            let targetTexture = null;
            
            gltf.scene.traverse((child) => {
                if (child.isMesh && !targetMesh) {
                    targetMesh = child;
                    if (child.material && child.material.map) {
                        targetTexture = child.material.map;
                    }
                }
            });

            if (!targetMesh) return statusElement.innerText = "ERROR // 檔案中未檢測到實體網格。";

            statusElement.innerText = "SAMPLING // 提取原色與表面採樣中...";

            const sampler = new MeshSurfaceSampler(targetMesh).build();
            const particleCount = 60000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const uvs = new Float32Array(particleCount * 2);
            const tempPosition = new THREE.Vector3();
            const tempUv = new THREE.Vector2();

            for (let i = 0; i < particleCount; i++) {
                sampler.sample(tempPosition, undefined, undefined, tempUv);
                positions[i * 3] = tempPosition.x * 8.0;
                positions[i * 3 + 1] = tempPosition.y * 8.0;
                positions[i * 3 + 2] = tempPosition.z * 8.0;
                uvs[i * 2] = tempUv.x;
                uvs[i * 2 + 1] = tempUv.y;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0.0 },
                    uTexture: { value: targetTexture }
                },
                vertexShader: `
                    uniform float uTime;
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        float noiseX = sin(pos.y * 2.0 + uTime * 2.0) * 0.2;
                        float noiseY = cos(pos.x * 2.0 + uTime * 2.5) * 0.2;
                        float noiseZ = sin(pos.x * 2.0 + pos.y * 2.0 + uTime * 3.0) * 0.3;
                        pos.x += noiseX; pos.y += noiseY; pos.z += noiseZ;
                        
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = (12.0 + sin(uTime * 4.0 + pos.x)*3.0) * (5.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture;
                    varying vec2 vUv;
                    void main() {
                        vec2 coord = gl_PointCoord - vec2(0.5);
                        if (length(coord) > 0.5) discard;
                        vec4 texColor = texture2D(uTexture, vUv);
                        float alpha = smoothstep(0.5, 0.1, length(coord));
                        gl_FragColor = vec4(texColor.rgb, alpha * texColor.a * 0.9);
                    }
                `,
                transparent: true,
                blending: THREE.NormalBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            statusElement.innerText = "WAITING // 等待攝像頭權限授權...";
            initAIEngines();
        });

        function initAIEngines() {
            const faceMesh = new window.FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
            faceMesh.setOptions({ maxNumFaces: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            
            faceMesh.onResults((results) => {
                if (!particleSystem) return;
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const lm = results.multiFaceLandmarks[0];
                    const nose = lm[1];
                    const aspect = window.innerWidth / window.innerHeight;
                    
                    // 1. 位置跟隨
                    const targetX = (nose.x - 0.5) * 30.0 * aspect;
                    const targetY = -(nose.y - 0.5) * 30.0;
                    const targetZ = -nose.z * 15.0;
                    
                    particleSystem.position.x += (targetX - particleSystem.position.x) * 0.4;
                    particleSystem.position.y += (targetY - particleSystem.position.y) * 0.4;
                    particleSystem.position.z += (targetZ - particleSystem.position.z) * 0.4;
                    
                    // 2. 動態大小縮放：計算左右臉頰的距離來判定距離遠近與頭部大小
                    const leftCheek = lm[234];
                    const rightCheek = lm[454];
                    const faceWidth = Math.sqrt(
                        Math.pow(rightCheek.x - leftCheek.x, 2) + 
                        Math.pow(rightCheek.y - leftCheek.y, 2)
                    );
                    // 根據實際畫面中的臉部寬度計算對應的 3D 縮放比例
                    const targetScale = faceWidth * 35.0; 
                    const currentScale = particleSystem.scale.x;
                    const newScale = currentScale + (targetScale - currentScale) * 0.4;
                    particleSystem.scale.set(newScale, newScale, newScale);

                    // 3. 旋轉同步
                    const top = lm[10], bottom = lm[152];
                    const pitch = Math.atan2(bottom.z - top.z, bottom.y - top.y);
                    const yaw = Math.atan2(rightCheek.z - leftCheek.z, rightCheek.x - leftCheek.x);
                    const roll = Math.atan2(rightCheek.y - leftCheek.y, rightCheek.x - left.x);

                    particleSystem.rotation.x += (-pitch - particleSystem.rotation.x) * 0.4;
                    particleSystem.rotation.y += (yaw - particleSystem.rotation.y) * 0.4;
                    particleSystem.rotation.z += (-roll - particleSystem.rotation.z) * 0.4;
                }
            });

            const selfieSegmentation = new window.SelfieSegmentation({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`});
            selfieSegmentation.setOptions({ modelSelection: 1 });

            selfieSegmentation.onResults((results) => {
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.filter = 'blur(12px) brightness(0.9)';
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                
                canvasCtx.globalCompositeOperation = 'destination-in';
                canvasCtx.drawImage(results.segmentationMask, 0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'destination-over';
                canvasCtx.filter = 'blur(12px) brightness(0.9)';
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.restore();
            });

            const cameraUtils = new window.Camera(videoElement, {
                onFrame: async () => {
                    await selfieSegmentation.send({image: videoElement});
                    await faceMesh.send({image: videoElement});
                },
                width: 1280, height: 720
            });
            
            cameraUtils.start().then(() => {
                statusElement.innerText = "SYSTEM ACTIVE // 動態縮放、景深與追蹤已啟動";
                setTimeout(() => { statusElement.style.opacity = '0'; }, 3000);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (particleSystem) particleSystem.material.uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
