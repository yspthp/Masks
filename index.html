<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 智慧動態縮放與彩色粒子面具</title>
    <style>
        body { margin: 0; background-color: #050508; overflow: hidden; color: white; font-family: sans-serif; }
        #input_video { display: none; }
        
        /* 【修正】移除所有 scaleX(-1)，改由 JS 內部統一處理鏡像，防止座標系撕裂 */
        #output_canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; object-fit: cover; z-index: -1; 
        }
        #webgl-container { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; z-index: 1; pointer-events: none; 
        }
        #status { 
            position: absolute; top: 20px; left: 20px; padding: 10px; 
            background: rgba(0,0,0,0.6); border-left: 3px solid #00ffcc; 
            font-size: 14px; letter-spacing: 1px; z-index: 10; backdrop-filter: blur(5px); 
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div id="status">INITIALIZING // 載入動態縮放與景深虛化引擎...</div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    <div id="webgl-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');
        const container = document.getElementById('webgl-container');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeCanvas);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25; // 相機固定喺安全距離
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        resizeCanvas();

        let particleSystem = null;
        const clock = new THREE.Clock();
        const loader = new GLTFLoader();
        
        loader.load('./model.glb', (gltf) => {
            let targetMesh = null, targetTexture = null;
            gltf.scene.traverse((child) => {
                if (child.isMesh && !targetMesh) {
                    targetMesh = child;
                    if (child.material && child.material.map) targetTexture = child.material.map;
                }
            });
            if (!targetMesh) return statusElement.innerText = "ERROR // 檔案中未檢測到實體網格。";
            statusElement.innerText = "SAMPLING // 提取原色與表面採樣中...";

            const sampler = new MeshSurfaceSampler(targetMesh).build();
            const particleCount = 60000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const uvs = new Float32Array(particleCount * 2);
            const tempPosition = new THREE.Vector3(), tempUv = new THREE.Vector2();

            for (let i = 0; i < particleCount; i++) {
                sampler.sample(tempPosition, undefined, undefined, tempUv);
                positions[i * 3] = tempPosition.x * 8.0;
                positions[i * 3 + 1] = tempPosition.y * 8.0;
                positions[i * 3 + 2] = tempPosition.z * 8.0;
                uvs[i * 2] = tempUv.x; uvs[i * 2 + 1] = tempUv.y;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

            const material = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0.0 }, uTexture: { value: targetTexture } },
                vertexShader: `
                    uniform float uTime; varying vec2 vUv;
                    void main() {
                        vUv = uv; vec3 pos = position;
                        pos.x += sin(pos.y * 2.0 + uTime * 2.0) * 0.2;
                        pos.y += cos(pos.x * 2.0 + uTime * 2.5) * 0.2;
                        pos.z += sin(pos.x * 2.0 + pos.y * 2.0 + uTime * 3.0) * 0.3;
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = (12.0 + sin(uTime * 4.0 + pos.x)*3.0) * (5.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }`,
                fragmentShader: `
                    uniform sampler2D uTexture; varying vec2 vUv;
                    void main() {
                        vec2 coord = gl_PointCoord - vec2(0.5);
                        if (length(coord) > 0.5) discard;
                        vec4 texColor = texture2D(uTexture, vUv);
                        gl_FragColor = vec4(texColor.rgb, smoothstep(0.5, 0.1, length(coord)) * texColor.a * 0.9);
                    }`,
                transparent: true, blending: THREE.NormalBlending, depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            statusElement.innerText = "WAITING // 等待攝像頭權限授權...";
            initAIEngines();
        });

        function initAIEngines() {
            const faceMesh = new window.FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
            faceMesh.setOptions({ maxNumFaces: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            
            faceMesh.onResults((results) => {
                if (!particleSystem || !results.multiFaceLandmarks?.length) return;
                const lm = results.multiFaceLandmarks[0];
                const aspect = window.innerWidth / window.innerHeight;
                
                // 【核心修正 1】鏡像 X 座標，匹配前置鏡頭嘅視覺習慣
                const mx = (pt) => ({ x: 1.0 - pt.x, y: pt.y });
                const nose = mx(lm[1]);
                const leftCheek = mx(lm[234]);
                const rightCheek = mx(lm[454]);
                const top = mx(lm[10]), bottom = mx(lm[152]);
                const eyeL = mx(lm[33]), eyeR = mx(lm[263]);

                // 【核心修正 2】固定 Z 軸，用 2D 面闊控制 Scale (徹底杜絕雜訊爆炸)
                const targetX = (nose.x - 0.5) * 30.0 * aspect;
                const targetY = -(nose.y - 0.5) * 30.0;
                const targetZ = 0; // 固定喺原點，等相機自然透視
                
                const faceWidth = Math.hypot(rightCheek.x - leftCheek.x, rightCheek.y - leftCheek.y);
                const targetScale = faceWidth * 40.0; // 【微調參數 A】面具大細基數

                // 【核心修正 3】純 2D 幾何旋轉 (極度穩定，唔會抖動)
                const roll = Math.atan2(eyeR.y - eyeL.y, eyeR.x - eyeL.x); // 歪頭
                const cheekCenterX = (leftCheek.x + rightCheek.x) / 2;
                const yaw = (nose.x - cheekCenterX) * 4.0; // 搖頭
                const faceCenterY = (top.y + bottom.y) / 2;
                const pitch = (nose.y - faceCenterY) * 4.0; // 點頭

                // 平滑插值 (Lerp)
                particleSystem.position.x += (targetX - particleSystem.position.x) * 0.3;
                particleSystem.position.y += (targetY - particleSystem.position.y) * 0.3;
                particleSystem.position.z += (targetZ - particleSystem.position.z) * 0.3;
                
                const newScale = particleSystem.scale.x + (targetScale - particleSystem.scale.x) * 0.3;
                particleSystem.scale.set(newScale, newScale, newScale);

                particleSystem.rotation.x += (pitch - particleSystem.rotation.x) * 0.3;
                particleSystem.rotation.y += (-yaw - particleSystem.rotation.y) * 0.3;
                particleSystem.rotation.z += (roll - particleSystem.rotation.z) * 0.3;
            });

            const selfieSegmentation = new window.SelfieSegmentation({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`});
            selfieSegmentation.setOptions({ modelSelection: 1 });

            selfieSegmentation.onResults((results) => {
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                // 【核心修正 4】手動鏡像 2D 繪製，確保背景同人物符合照鏡習慣
                canvasCtx.scale(-1, 1);
                canvasCtx.translate(-canvasElement.width, 0);

                // 1. 模糊背景
                canvasCtx.filter = 'blur(15px) brightness(0.85)';
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.filter = 'none';

                // 2. 離屏摳出清晰人物
                if (!window._fgCanvas) {
                    window._fgCanvas = document.createElement('canvas');
                    window._fgCtx = window._fgCanvas.getContext('2d');
                }
                const fg = window._fgCanvas, fgCtx = window._fgCtx;
                if (fg.width !== canvasElement.width) { fg.width = canvasElement.width; fg.height = canvasElement.height; }
                
                fgCtx.clearRect(0, 0, fg.width, fg.height);
                fgCtx.drawImage(results.image, 0, 0, fg.width, fg.height);
                fgCtx.globalCompositeOperation = 'destination-in';
                fgCtx.drawImage(results.segmentationMask, 0, 0, fg.width, fg.height);
                fgCtx.globalCompositeOperation = 'source-over';

                // 3. 疊加清晰人物
                canvasCtx.drawImage(fg, 0, 0);
                canvasCtx.restore();
            });

            const cameraUtils = new window.Camera(videoElement, {
                onFrame: async () => {
                    await selfieSegmentation.send({image: videoElement});
                    await faceMesh.send({image: videoElement});
                },
                width: 1280, height: 720
            });
            cameraUtils.start().then(() => {
                statusElement.innerText = "SYSTEM ACTIVE // 動態縮放、景深與追蹤已啟動";
                setTimeout(() => { statusElement.style.opacity = '0'; }, 3000);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (particleSystem) particleSystem.material.uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
