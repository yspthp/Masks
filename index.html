<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <style>
        body { margin: 0; background-color: #050508; overflow: hidden; color: white; font-family: sans-serif; }
        #input_video { display: none; }
        #output_canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -1;
        }
        #webgl-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none;
        }
        #status {
            position: absolute; top: 20px; left: 20px; padding: 10px;
            background: rgba(0,0,0,0.6); border-left: 3px solid #00ffcc;
            font-size: 14px; letter-spacing: 1px; z-index: 10; backdrop-filter: blur(5px);
        }
        /* ===== 即時調整 UI ===== */
        #ui { position: fixed; bottom: 20px; right: 20px; z-index: 30; font-family: sans-serif; text-align: right; }
        #uiToggle {
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(0,0,0,0.6); color: #00ffcc; border: 1px solid #00ffcc;
            font-size: 20px; cursor: pointer; backdrop-filter: blur(5px);
        }
        #uiPanel {
            display: none; margin-bottom: 10px; padding: 12px 14px;
            background: rgba(0,0,0,0.65); border-left: 3px solid #00ffcc;
            color: white; font-size: 13px; letter-spacing: 1px;
            backdrop-filter: blur(5px); min-width: 220px; text-align: left;
        }
        #uiPanel.open { display: block; }
        #uiPanel input[type=range] { width: 100%; margin-top: 8px; accent-color: #00ffcc; }
        /* ===== 截圖／全螢幕按鈕／閃光／提示 ===== */
        #captureBtn {
            position: fixed; bottom: 20px; left: 20px; z-index: 30;
            width: 52px; height: 52px; border-radius: 50%;
            background: rgba(0,0,0,0.6); border: 1px solid #00ffcc;
            font-size: 24px; cursor: pointer; backdrop-filter: blur(5px);
        }
        #fsBtn {
            position: fixed; bottom: 20px; right: 76px; z-index: 30;
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(0,0,0,0.6); color: #00ffcc; border: 1px solid #00ffcc;
            font-size: 20px; cursor: pointer; backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
        }
        #flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 40; transition: opacity .15s; }
        #toast {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            padding: 10px 18px; background: rgba(0,0,0,0.75); border-left: 3px solid #00ffcc;
            color: #fff; font-size: 13px; letter-spacing: 1px; z-index: 40;
            opacity: 0; pointer-events: none; transition: opacity .4s;
            max-width: 90vw; text-align: center;
        }
        #toast.show { opacity: 1; }
        /* ===== 入職拍攝指引（入職須知卡） ===== */
        #onboardGuide {
            position: fixed; bottom: 88px; left: 50%;
            transform: translateX(-50%) translateY(8px);
            width: fit-content; max-width: min(90vw, 560px);
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(6, 10, 16, 0.76) 0%, rgba(4, 7, 12, 0.86) 100%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-left: 3px solid #d8b36a;
            border-radius: 4px 12px 12px 4px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.48), 0 0 24px rgba(0, 255, 204, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px) saturate(125%); -webkit-backdrop-filter: blur(12px) saturate(125%);
            color: rgba(255, 255, 255, 0.95);
            font-size: clamp(13px, 1.6vw, 15px);
            letter-spacing: 1.5px; line-height: 1.85;
            text-align: left; pointer-events: none; z-index: 25;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #onboardGuide.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #onboardGuide .guide-title {
            color: #00ffcc;
            font-weight: 600;
            letter-spacing: 2.5px;
            margin-bottom: 6px;
            text-align: center;
        }
        #onboardGuide .guide-step {
            color: rgba(255, 255, 255, 0.94);
        }
        /* ===== 浮空文字（開場＋問題） ===== */
        #question {
            position: absolute; left: 50%; top: 9%; transform: translateX(-50%);
            width: fit-content; max-width: min(88vw, 760px);
            padding: 14px 28px 16px; border-radius: 18px;

            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.42), 0 0 24px rgba(0, 255, 204, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px) saturate(125%); -webkit-backdrop-filter: blur(12px) saturate(125%);
            text-align: center; pointer-events: none; z-index: 5;
            color: rgba(255, 255, 255, 0.98); font-size: clamp(16px, 2.4vw, 26px);
            font-weight: 400; letter-spacing: 3px; line-height: 1.8;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 2px 10px rgba(0, 0, 0, 0.88), 0 0 20px rgba(0, 255, 204, 0.32);

        #question:empty { opacity: 0 !important; }
        #question.show { opacity: 1; }
        @keyframes floatY { 0%,100% { margin-top: 0; } 50% { margin-top: -14px; } }
            /* ===== V2 visual polish & light-background readability ===== */
        body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:2; background:radial-gradient(circle at 50% 42%, rgba(0,255,204,.08), transparent 34%), linear-gradient(135deg, rgba(5,5,8,.18), rgba(5,5,8,.52)); mix-blend-mode:screen; }
        #status { border-left-color:#d8b36a; background:rgba(6, 9, 14, 0.78); color:rgba(255, 255, 255, 0.95); text-shadow:0 1px 3px rgba(0,0,0,0.9); box-shadow:0 6px 22px rgba(0,0,0,0.36), 0 0 0 1px rgba(255,255,255,0.1); border-radius:0 8px 8px 0; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); text-transform:uppercase; transition:opacity .8s, border-color .8s; }
        #uiPanel { background:rgba(6, 9, 14, 0.82); color:rgba(255, 255, 255, 0.96); text-shadow:0 1px 3px rgba(0,0,0,0.9); box-shadow:0 8px 28px rgba(0,0,0,0.42), 0 0 0 1px rgba(255,255,255,0.12); border-radius:0 8px 8px 0; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
        #toast { background:rgba(6, 9, 14, 0.86); color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.9); box-shadow:0 10px 32px rgba(0,0,0,0.48), 0 0 0 1px rgba(0,255,204,0.22); border-radius:0 8px 8px 0; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
        #question::after { content:""; display:block; width:48px; height:1.5px; margin:12px auto 0; background:linear-gradient(90deg, transparent, #00ffcc, transparent); opacity:.85; box-shadow:0 1px 4px rgba(0,0,0,0.8); }
        #captureBtn,#uiToggle,#fsBtn { background:rgba(6, 9, 14, 0.76); text-shadow:0 1px 4px rgba(0,0,0,0.9); box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 8px 28px rgba(0,0,0,.42); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:transform .2s, background .2s, box-shadow .2s; }
        #captureBtn:hover,#uiToggle:hover,#fsBtn:hover { transform:translateY(-2px) scale(1.04); background:rgba(6, 18, 20, 0.88); box-shadow:0 0 0 1px rgba(0,255,204,.5), 0 0 24px rgba(0,255,204,.28), 0 8px 28px rgba(0,0,0,.48); }
        #webgl-container::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(4,6,10,0.42) 0%, rgba(4,6,10,0.12) 18%, transparent 34%), radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,.34) 100%); }
        @media (max-width:600px) { #question { top:10%; padding:12px 20px 14px; font-size:clamp(15px,4.6vw,21px); letter-spacing:2px; } #status{top:12px;left:12px;font-size:11px;} #onboardGuide{bottom:82px;padding:12px 16px;font-size:13px;letter-spacing:1px;} }</style>

<body>

        /* ================= 版本標籤 ================= */

        /* ============ 素臉開場文案 ============ */

        ];

        /* ============ 領取頁通用回應 ============ */
        const CLAIM_LINE_1 = '在你成為任何角色之前，你首先是你。';
        const CLAIM_LINE_2 = '神所看重的，是真實的你。';

        /* ================= 面具清單 ================= */
        const MODEL_FILES = [
            './model.glb',    // 貓頭鷹
            './model2.glb',   // 刺蝟

        /* ============ 每模型獨立設定 ============ */
        const MODEL_OVERRIDES = {

            './model2.glb': { count: 150000, pointSize: 1.6, noiseAmp: 0.35, scaleMul: 1.2 },
            './model3.glb': { scaleMul: 1.2, count: 110000 },
            './model4.glb': { scaleMul: 1.35, yOffset: 0.21, count: 79860 },
            './model5.glb': { count: 72000, pointSize: 1.3, noiseAmp: 0.5, scaleMul: 1.1 },
        };

        /* ================= 全域參數 ================= */
        const DEFAULT_PARTICLE_COUNT = 60000;
        const SWITCH_INTERVAL = 8.0;
        const DISSOLVE_OUT    = 0.8;
        const DISSOLVE_IN     = 1.0;
        const SCALE_FACTOR = 14.4;
        const MASK_Y_OFFSET = 0.08;
        const ROTATION_AMP  = 0.8;
        const LERP_SPEED    = 0.3;
        const STRETCH_COMPENSATION = true;
        const MIRROR_DISPLAY = true;
        const MODEL_YAW_OFFSET   = THREE.MathUtils.degToRad(0);
        const MODEL_ROLL_OFFSET  = THREE.MathUtils.degToRad(0);

        const PITCH_OPTIONS = [0, 180, 90, 270];
        let pitchOptionIndex = 0;
        let modelPitchOffset = THREE.MathUtils.degToRad(PITCH_OPTIONS[0]);

        /* ================= 模式分流 ================= */
        const IS_CLAIM = new URLSearchParams(location.search).has('claim');
        if (IS_CLAIM) startClaimMode(); else startBooth();

        /* ############################################################
           領取頁模式（?claim=1）
        ############################################################ */
        function startClaimMode() {
            document.body.innerHTML = `
                <style>
                    body { background:#050508; color:#fff; font-family:sans-serif; margin:0;
                           min-height:100vh; display:flex; align-items:center; justify-content:center; }
                    #claimWrap { text-align:center; padding:24px; max-width:92vw; }
                    h1 { font-size:22px; letter-spacing:6px; color:#00ffcc; }
                    #claimSub { color:#888; font-size:12px; letter-spacing:2px; margin-top:4px; }
                    #claimImg { max-width:92vw; max-height:56vh; border:2px solid #00ffcc;
                                border-radius:10px; background:#111; margin-top:14px; }
                    #claimDownload { display:inline-block; margin-top:14px; padding:10px 26px;
                                     border:1px solid #00ffcc; color:#00ffcc; text-decoration:none;
                                     letter-spacing:2px; border-radius:6px; }
                    #claimHint { color:#888; font-size:12px; letter-spacing:1px; }
                    #claimLine1 { margin-top:20px; color:rgba(255,255,255,.92); font-size:15px;
                                  letter-spacing:2px; line-height:1.9; }
                    #claimLine2 { margin-top:10px; color:#00ffcc; font-size:15px; letter-spacing:3px; }
                        /* ===== V2 visual polish & light-background readability ===== */
        body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:2; background:radial-gradient(circle at 50% 42%, rgba(0,255,204,.08), transparent 34%), linear-gradient(135deg, rgba(5,5,8,.18), rgba(5,5,8,.52)); mix-blend-mode:screen; }
        #status { border-left-color:#d8b36a; background:rgba(6, 9, 14, 0.78); color:rgba(255, 255, 255, 0.95); text-shadow:0 1px 3px rgba(0,0,0,0.9); box-shadow:0 6px 22px rgba(0,0,0,0.36), 0 0 0 1px rgba(255,255,255,0.1); border-radius:0 8px 8px 0; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); text-transform:uppercase; transition:opacity .8s, border-color .8s; }
        #question::after { content:""; display:block; width:48px; height:1.5px; margin:12px auto 0; background:linear-gradient(90deg, transparent, #00ffcc, transparent); opacity:.85; box-shadow:0 1px 4px rgba(0,0,0,0.8); }
        #captureBtn,#uiToggle,#fsBtn { background:rgba(6, 9, 14, 0.76); text-shadow:0 1px 4px rgba(0,0,0,0.9); box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 8px 28px rgba(0,0,0,.42); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:transform .2s, background .2s, box-shadow .2s; }
        #captureBtn:hover,#uiToggle:hover,#fsBtn:hover { transform:translateY(-2px) scale(1.04); background:rgba(6, 18, 20, 0.88); box-shadow:0 0 0 1px rgba(0,255,204,.5), 0 0 24px rgba(0,255,204,.28), 0 8px 28px rgba(0,0,0,.48); }
        #webgl-container::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(4,6,10,0.42) 0%, rgba(4,6,10,0.12) 18%, transparent 34%), radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,.34) 100%); }
        @media (max-width:600px) { #question { top:10%; padding:12px 20px 14px; font-size:clamp(15px,4.6vw,21px); letter-spacing:2px; } #status{top:12px;left:12px;font-size:11px;} }</style>
                <div id="claimWrap">
                    <h1>社畜照相館</h1>
                    <div id="claimSub">領取你嘅職員照</div>
                    <img id="claimImg" alt="最新照片">
                    <p id="claimHint">頁面只保留最新一張 · 每 4 秒自動刷新</p>
                    <a id="claimDownload" download="社畜照相館.jpg">下載照片</a>
                    <div id="claimLine1">${CLAIM_LINE_1}</div>
                    <div id="claimLine2">${CLAIM_LINE_2}</div>
                </div>`;
            const img  = document.getElementById('claimImg');
            const dl   = document.getElementById('claimDownload');
            const hint = document.getElementById('claimHint');
            if (!SUPABASE_URL) { hint.textContent = '未設定遠端領取（SUPABASE_URL 為空）'; return; }

            const baseImg = `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/latest.jpg`;
            let got = false;
            const refresh = () => {
                const u = baseImg + '?t=' + Date.now();
                const probe = new Image();
                probe.onload = () => { got = true; img.src = u; dl.href = u; };
                probe.onerror = () => { if (!got) hint.textContent = '未有照片——去 booth 影一張啦！'; };
                probe.src = u;
            };
            refresh();
            setInterval(refresh, 4000);
        }

        /* ############################################################
           Booth 模式
        ############################################################ */
        function startBooth() {

            let userSizeMul = 1.0;
            try { userSizeMul = parseFloat(localStorage.getItem('maskSizeMul')) || 1.0; } catch (e) {}
            const sizeSlider = document.getElementById('sizeSlider');
            const sizeVal    = document.getElementById('sizeVal');
            const uiPanel    = document.getElementById('uiPanel');
            const uiToggle   = document.getElementById('uiToggle');
            sizeSlider.value = userSizeMul;
            sizeVal.textContent = Math.round(userSizeMul * 100) + '%';
            sizeSlider.addEventListener('input', () => {
                userSizeMul = parseFloat(sizeSlider.value);
                sizeVal.textContent = Math.round(userSizeMul * 100) + '%';
                try { localStorage.setItem('maskSizeMul', String(userSizeMul)); } catch (e) {}
            });
            uiToggle.addEventListener('click', () => {
                uiToggle.blur();
                uiPanel.classList.toggle('open');
            });

            const videoElement = document.getElementById('input_video');
            const canvasElement = document.getElementById('output_canvas');
            const canvasCtx = canvasElement.getContext('2d');
            const statusElement = document.getElementById('status');
            const container = document.getElementById('webgl-container');
            const questionEl = document.getElementById('question');
            const captureBtn = document.getElementById('captureBtn');
            const flashEl = document.getElementById('flash');
            const toastEl = document.getElementById('toast');
            const onboardGuideEl = document.getElementById('onboardGuide');

            let guideTimer = null;
            function showOnboardGuide() {
                if (!onboardGuideEl) return;
                onboardGuideEl.classList.add('show');
                clearTimeout(guideTimer);
                guideTimer = setTimeout(() => {
                    hideOnboardGuide();
                }, 6000);
            }
            function hideOnboardGuide() {
                if (!onboardGuideEl) return;
                onboardGuideEl.classList.remove('show');
                clearTimeout(guideTimer);
                guideTimer = null;
            }

            let toastTimer = null;
            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 5000);
            }

            let phase = 'intro';
            let introStarted = false;
            let introStart = 0;
            let introLineIndex = -1;
            let lastFaceTime = 0;

            let pitchBaseline = null;
            let scaleRatioBaseline = null;
            let baselineCount = 0;
            const BASELINE_FRAMES = 45;
            let recalibrate = false;
            // 捕獲階段（useCapture=true）優先攔截 Enter，防止焦點按鈕（如全螢幕按鈕）被瀏覽器預設觸發
            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') recalibrate = true;
                if (e.key === 'p' || e.key === 'P') {
                    pitchOptionIndex = (pitchOptionIndex + 1) % PITCH_OPTIONS.length;
                    modelPitchOffset = THREE.MathUtils.degToRad(PITCH_OPTIONS[pitchOptionIndex]);
                    statusElement.style.opacity = '1';
                    statusElement.innerText = `PITCH OFFSET: ${PITCH_OPTIONS[pitchOptionIndex]}°（撳 P 切換）`;
                }
                if (e.code === 'Enter' || e.key === 'Enter' || e.code === 'NumpadEnter') {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    if (document.activeElement && typeof document.activeElement.blur === 'function') {
                        document.activeElement.blur();
                    }
                    captureBtn.click();
                }
            }, true);

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Enter' || e.key === 'Enter' || e.code === 'NumpadEnter') {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                }
            }, true);

            const fsBtn = document.getElementById('fsBtn');
            fsBtn.addEventListener('click', () => {
                fsBtn.blur();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {
                        showToast('此瀏覽器未能切換全螢幕');
                    });
                } else {
                    document.exitFullscreen();
                }
            });
            fsBtn.addEventListener('keydown', (e) => {
                if (e.code === 'Enter' || e.key === 'Enter' || e.code === 'NumpadEnter') {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    fsBtn.blur();
                    captureBtn.click();
                }
            });
            document.addEventListener('fullscreenchange', () => {
                fsBtn.blur();
                if (document.fullscreenElement) {
                    fsBtn.title = '退出全螢幕';
                    fsBtn.textContent = '✕';
                } else {
                    fsBtn.title = '切換全螢幕';
                    fsBtn.textContent = '⛶';
                }
            });

            let trackedNose = null;
            function pickFace(faces) {
                let largest = null, largestSize = 0;
                let nearest = null, nearestD = Infinity;
                for (const f of faces) {
                    const size = Math.hypot(f[263].x - f[33].x, f[263].y - f[33].y);
                    if (size > largestSize) { largestSize = size; largest = f; }
                    if (trackedNose) {
                        const d = Math.hypot(f[1].x - trackedNose.x, f[1].y - trackedNose.y);
                        if (d < nearestD) { nearestD = d; nearest = f; }
                    }
                }
                if (!trackedNose) return largest;
                if (nearest && nearestD < 0.2) {
                    const nSize = Math.hypot(nearest[263].x - nearest[33].x, nearest[263].y - nearest[33].y);
                    if (largest !== nearest && largestSize > nSize * 1.25) return largest;
                    return nearest;
                }
                return largest;
            }

            function resizeCanvas() {
                canvasElement.width = window.innerWidth;
                canvasElement.height = window.innerHeight;
                if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
            window.addEventListener('resize', resizeCanvas);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25;
            const renderer = new THREE.WebGLRenderer({
                antialias: true, alpha: true,
                preserveDrawingBuffer: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            resizeCanvas();

            const FRUSTUM_H = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

            if (MIRROR_DISPLAY) {
                canvasElement.style.transform = 'scaleX(-1)';
                renderer.domElement.style.transform = 'scaleX(-1)';
            }

            const maskGroup = new THREE.Group();
            scene.add(maskGroup);

            let particleSystem = null;
            const clock = new THREE.Clock();
            const loader = new GLTFLoader();

            let maskAssets = [];
            let currentIndex = 0;
            let transition = null;
            let lastFormedTime = 0;

            function buildAsset(gltf, cfg) {
                let targetMesh = null, targetTexture = null;
                gltf.scene.traverse((child) => {
                    if (child.isMesh && !targetMesh) {
                        targetMesh = child;
                        if (child.material && child.material.map) targetTexture = child.material.map;
                    }
                });
                if (!targetMesh) return null;

                const sampler = new MeshSurfaceSampler(targetMesh).build();
                const particleCount = cfg.count || DEFAULT_PARTICLE_COUNT;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const uvs = new Float32Array(particleCount * 2);
                const randoms = new Float32Array(particleCount);
                const tempPosition = new THREE.Vector3(), tempUv = new THREE.Vector2();

                for (let i = 0; i < particleCount; i++) {
                    sampler.sample(tempPosition, undefined, undefined, tempUv);
                    positions[i * 3] = tempPosition.x * 8.0;
                    positions[i * 3 + 1] = tempPosition.y * 8.0;
                    positions[i * 3 + 2] = tempPosition.z * 8.0;
                    uvs[i * 2] = tempUv.x;
                    uvs[i * 2 + 1] = tempUv.y;
                    randoms[i] = Math.random();
                }

                let minX = Infinity, minY = Infinity, minZ = Infinity;
                let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
                for (let i = 0; i < positions.length; i += 3) {
                    minX = Math.min(minX, positions[i]);     maxX = Math.max(maxX, positions[i]);
                    minY = Math.min(minY, positions[i + 1]); maxY = Math.max(maxY, positions[i + 1]);
                    minZ = Math.min(minZ, positions[i + 2]); maxZ = Math.max(maxZ, positions[i + 2]);
                }
                const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
                const maxDim = Math.max(maxX - minX, maxY - minY, maxZ - minZ) || 1;
                const norm = 10 / maxDim;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i]     = (positions[i]     - cx) * norm;
                    positions[i + 1] = (positions[i + 1] - cy) * norm;
                    positions[i + 2] = (positions[i + 2] - cz) * norm;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
                geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

                return { geometry, texture: targetTexture, cfg };
            }

            function createMaterial(texture, cfg) {
                return new THREE.ShaderMaterial({
                    uniforms: {
                        uTime: { value: 0.0 },
                        uTexture: { value: texture },
                        uDissolve: { value: 0.0 },
                        uPointSize: { value: cfg.pointSize ?? 1.0 },
                        uNoiseAmp: { value: cfg.noiseAmp ?? 1.0 }
                    },
                    vertexShader: `
                        uniform float uTime;
                        uniform float uDissolve;
                        uniform float uPointSize;
                        uniform float uNoiseAmp;
                        attribute float aRandom;
                        varying vec2 vUv;
                        varying float vAlpha;
                        void main() {
                            vUv = uv;
                            vec3 pos = position;
                            pos.x += sin(pos.y * 2.0 + uTime * 2.0) * 0.2 * uNoiseAmp;
                            pos.y += cos(pos.x * 2.0 + uTime * 2.5) * 0.2 * uNoiseAmp;
                            pos.z += sin(pos.x * 2.0 + pos.y * 2.0 + uTime * 3.0) * 0.3 * uNoiseAmp;

                            float local = clamp(uDissolve * 1.5 - aRandom * 0.5, 0.0, 1.0);
                            float ease = local * local * (3.0 - 2.0 * local);
                            vec3 scatterDir = normalize(position + vec3(
                                (aRandom - 0.5) * 2.0,
                                (fract(aRandom * 7.31) - 0.5) * 2.0,
                                (fract(aRandom * 3.77) - 0.5) * 2.0
                            ));
                            pos += scatterDir * ease * 7.0;
                            vAlpha = 1.0 - ease;

                            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                            gl_PointSize = uPointSize * (12.0 + sin(uTime * 4.0 + pos.x)*3.0) * (5.0 / -mvPosition.z);
                            gl_Position = projectionMatrix * mvPosition;
                        }`,
                    fragmentShader: `
                        uniform sampler2D uTexture;
                        varying vec2 vUv;
                        varying float vAlpha;
                        void main() {
                            vec2 coord = gl_PointCoord - vec2(0.5);
                            if (length(coord) > 0.5) discard;
                            vec4 texColor = texture2D(uTexture, vUv);
                            float alpha = smoothstep(0.5, 0.1, length(coord)) * texColor.a * 0.9 * vAlpha;
                            if (alpha < 0.01) discard;
                            gl_FragColor = vec4(texColor.rgb, alpha);
                        }`,
                    transparent: true, blending: THREE.NormalBlending, depthWrite: false
                });
            }

            async function loadAllMasks() {
                for (let i = 0; i < MODEL_FILES.length; i++) {
                    statusElement.innerText = `LOADING // 載入面具模型 ${i + 1}/${MODEL_FILES.length}...`;
                    try {
                        const gltf = await loader.loadAsync(MODEL_FILES[i]);
                        const cfg = MODEL_OVERRIDES[MODEL_FILES[i]] || {};
                        const asset = buildAsset(gltf, cfg);
                        if (asset) maskAssets.push(asset);
                    } catch (e) {
                        console.warn(`SKIP // 無法載入 ${MODEL_FILES[i]}`);
                    }
                }
                return maskAssets.length > 0;
            }

            function applyAsset(i) {
                document.documentElement.style.setProperty('--mask-index', i);
                currentIndex = i;
                const a = maskAssets[i];
                particleSystem.geometry = a.geometry;
                const u = particleSystem.material.uniforms;
                u.uTexture.value = a.texture;
                u.uPointSize.value = a.cfg.pointSize ?? 1.0;
                u.uNoiseAmp.value = a.cfg.noiseAmp ?? 1.0;
            }

            function resetExperience() {
                phase = 'intro';
                introStarted = false;
                introLineIndex = -1;
                transition = null;
                maskGroup.visible = false;
                questionEl.classList.remove('show');
                questionEl.textContent = '';
                hideOnboardGuide();
                pitchBaseline = null;
                scaleRatioBaseline = null;
                baselineCount = 0;
                trackedNose = null;
                if (particleSystem) {
                    currentIndex = 0;
                    applyAsset(0);
                    particleSystem.material.uniforms.uDissolve.value = 0;
                }
            }

            async function capturePhoto() {
                const W = canvasElement.width, H = canvasElement.height;
                const cap = document.createElement('canvas');
                cap.width = W; cap.height = H;
                const c = cap.getContext('2d');
                c.save();
                c.translate(W, 0); c.scale(-1, 1);
                c.drawImage(canvasElement, 0, 0);
                c.drawImage(renderer.domElement, 0, 0);
                c.restore();
                // 頂部與底部柔和暗角漸層，確保白色或淺色背景時文字依然清晰且具電影感
                const topGrad = c.createLinearGradient(0, 0, 0, H * 0.16);
                topGrad.addColorStop(0, 'rgba(4, 6, 12, 0.52)');
                topGrad.addColorStop(1, 'rgba(4, 6, 12, 0)');
                c.fillStyle = topGrad;
                c.fillRect(0, 0, W, H * 0.16);

                const botGrad = c.createLinearGradient(0, H * 0.82, 0, H);
                botGrad.addColorStop(0, 'rgba(4, 6, 12, 0)');
                botGrad.addColorStop(1, 'rgba(4, 6, 12, 0.62)');
                c.fillStyle = botGrad;
                c.fillRect(0, H * 0.82, W, H * 0.18);

                const drawCaption = (text, y, fontSize) => {
                    if (!text) return;
                    c.save();
                    c.font = `500 ${fontSize}px sans-serif`;
                    c.textAlign = 'center';
                    c.lineJoin = 'round';
                    c.miterLimit = 2;
                    c.shadowColor = 'rgba(0, 0, 0, 0.9)';
                    c.shadowBlur = 14;
                    c.shadowOffsetY = 2;
                    c.strokeStyle = 'rgba(4, 6, 12, 0.78)';
                    c.lineWidth = Math.max(3, Math.round(fontSize * 0.16));
                    c.strokeText(text, W / 2, y);
                    c.fillStyle = 'rgba(255, 255, 255, 0.98)';
                    c.fillText(text, W / 2, y);
                    c.restore();
                };
                drawCaption('社畜照相館', H * 0.07, Math.round(H * 0.045));
                drawCaption(QUESTIONS[currentIndex] || '', H * 0.95, Math.round(H * 0.03));
                return await new Promise(r => cap.toBlob(r, 'image/jpeg', 0.9));
            }

            function downloadBlob(blob) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = '社畜照相館.jpg';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 5000);
            }

            async function uploadLatest(blob) {
                const dataUrl = await new Promise((resolve, reject) => {
                    const f = new FileReader();
                    f.onload = () => resolve(f.result);
                    f.onerror = reject;
                    f.readAsDataURL(blob);
                });
                const res = await fetch(SUPABASE_URL + '/functions/v1/upload-latest', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY
                    },
                    body: JSON.stringify({ image: dataUrl, index: currentIndex })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const j = await res.json();
                if (!j.ok) throw new Error(j.error || 'upload failed');
            }

            captureBtn.addEventListener('click', async () => {
                captureBtn.blur();
                if (phase !== 'cycle') {
                    showToast('面具未戴上——先歡迎自己入職 😉');
                    return;
                }
                flashEl.style.opacity = '0.9';
                setTimeout(() => flashEl.style.opacity = '0', 150);
                const blob = await capturePhoto();
                if (SUPABASE_URL) {
                    try {
                        showToast('正在上傳...');
                        await uploadLatest(blob);
                        showToast('已上傳！掃描 QR Code 領取');
                    } catch (e) {
                        downloadBlob(blob);
                        showToast('上傳失敗，已直接下載照片');
                    }
                } else {
                    downloadBlob(blob);
                    showToast('已儲存去你嘅裝置');
                }
            });

            (async () => {
                const ok = await loadAllMasks();
                if (!ok) {
                    statusElement.innerText = "ERROR // 面具模型載入失敗";
                    return;
                }
                particleSystem = new THREE.Points(maskAssets[0].geometry, createMaterial(maskAssets[0].texture, maskAssets[0].cfg));
                applyAsset(0);
                maskGroup.add(particleSystem);
                maskGroup.visible = false;
                statusElement.innerText = "WAITING // 等待攝像頭權限授權...";
                initAIEngines();
            })();

            function initAIEngines() {
                const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
                faceMesh.setOptions({ maxNumFaces: 4, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

                faceMesh.onResults((results) => {
                    if (!particleSystem || !results.multiFaceLandmarks?.length) return;
                    lastFaceTime = performance.now();
                    const lm = pickFace(results.multiFaceLandmarks);
                    const aspect = window.innerWidth / window.innerHeight;

                    const nose = lm[1];
                    trackedNose = { x: nose.x, y: nose.y };
                    const eyeL = lm[33], eyeR = lm[263];
                    const cfg = maskAssets[currentIndex]?.cfg || {};
                    const yOff = MASK_Y_OFFSET + (cfg.yOffset || 0);
                    const scaleMul = cfg.scaleMul || 1.0;

                    const anchorX = (lm[234].x + lm[454].x) / 2;
                    const FRUSTUM_W = FRUSTUM_H * aspect;

                    const eyeDist = Math.hypot(eyeR.x - eyeL.x, eyeR.y - eyeL.y);
                    const faceH = Math.hypot(lm[152].x - lm[10].x, lm[152].y - lm[10].y);
                    const ratioNow = eyeDist / Math.max(1e-4, faceH);

                    const frontalness = THREE.MathUtils.clamp(ratioNow / (scaleRatioBaseline || ratioNow), 0, 1.2);
                    const reliable = !scaleRatioBaseline || frontalness > 0.6;

                    const eyeCenterX = (eyeL.x + eyeR.x) / 2;
                    const eyeCenterY = (eyeL.y + eyeR.y) / 2;

                    const rawRatio = (nose.y - eyeCenterY) / eyeDist;
                    if (recalibrate) {
                        if (reliable) {
                            pitchBaseline = rawRatio;
                            scaleRatioBaseline = ratioNow;
                            baselineCount = BASELINE_FRAMES;
                        }
                        recalibrate = false;
                    } else if (baselineCount < BASELINE_FRAMES && frontalness > 0.85) {
                        pitchBaseline = (pitchBaseline ?? 0) + rawRatio / BASELINE_FRAMES;
                        scaleRatioBaseline = (scaleRatioBaseline ?? 0) + ratioNow / BASELINE_FRAMES;
                        baselineCount++;
                    }
                    const base = pitchBaseline ?? rawRatio;
                    const stableEyeDist = faceH * (scaleRatioBaseline ?? ratioNow);

                    if (!reliable) return;

                    const w = THREE.MathUtils.clamp((frontalness - 0.6) / 0.4, 0, 1);
                    const stableAnchorX = anchorX * w + eyeCenterX * (1 - w);

                    const targetX = (stableAnchorX - 0.5) * FRUSTUM_W;
                    const targetY = -(nose.y - 0.5 - yOff) * FRUSTUM_H;
                    const targetZ = 0;

                    const targetScale = stableEyeDist * SCALE_FACTOR * scaleMul * userSizeMul;

                    const dynamicPitch = (rawRatio - base) * ROTATION_AMP;
                    const dynamicYaw   = THREE.MathUtils.clamp(((nose.x - eyeCenterX) / eyeDist) * ROTATION_AMP, -0.8, 0.8);
                    const dynamicRoll  = THREE.MathUtils.clamp(-Math.atan2(eyeR.y - eyeL.y, eyeR.x - eyeL.x), -0.4, 0.4) * Math.min(1, frontalness);

                    const targetPitch = dynamicPitch + modelPitchOffset;
                    const targetYaw   = dynamicYaw   + MODEL_YAW_OFFSET;
                    const targetRoll  = dynamicRoll  + MODEL_ROLL_OFFSET;

                    maskGroup.position.x = THREE.MathUtils.lerp(maskGroup.position.x, targetX, LERP_SPEED);
                    maskGroup.position.y = THREE.MathUtils.lerp(maskGroup.position.y, targetY, LERP_SPEED);
                    maskGroup.position.z = THREE.MathUtils.lerp(maskGroup.position.z, targetZ, LERP_SPEED);

                    maskGroup.rotation.x = THREE.MathUtils.lerp(maskGroup.rotation.x, targetPitch, LERP_SPEED);
                    maskGroup.rotation.y = THREE.MathUtils.lerp(maskGroup.rotation.y, targetYaw, LERP_SPEED);
                    maskGroup.rotation.z = THREE.MathUtils.lerp(maskGroup.rotation.z, targetRoll, LERP_SPEED);

                    maskGroup.scale.setScalar(THREE.MathUtils.lerp(maskGroup.scale.x, targetScale, LERP_SPEED));
                });

                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await faceMesh.send({ image: videoElement });
                        canvasCtx.save();
                        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                        canvasCtx.restore();
                    },
                    width: 1280, height: 720
                });

                cameraUtils.start().then(() => {
                    statusElement.innerText = `SYSTEM ACTIVE // build ${BUILD} // 站入鏡頭即開始`;
                    console.log('BUILD:', BUILD);
                    setTimeout(() => { statusElement.style.opacity = '0'; }, 5000);
                    showOnboardGuide();
                });
            }

            function animate() {
                requestAnimationFrame(animate);
                const t = clock.getElapsedTime();
                const nowMs = performance.now();
                if (!particleSystem) { renderer.render(scene, camera); return; }

                const u = particleSystem.material.uniforms;
                u.uTime.value = t;

                const idle = lastFaceTime > 0 && (nowMs - lastFaceTime) > IDLE_RESET_MS;
                if (idle && !(phase === 'intro' && !introStarted)) {
                    resetExperience();
                }

                const facePresent = lastFaceTime > 0 && (nowMs - lastFaceTime) < 1000;

                if (phase === 'intro') {
                    if (facePresent && !introStarted) {
                        introStarted = true;
                        introStart = nowMs;
                        introLineIndex = 0;
                        questionEl.textContent = INTRO_LINES[0];
                        questionEl.classList.add('show');
                        showOnboardGuide();
                    } else if (introStarted) {
                        const el = (nowMs - introStart) / 1000;
                        let acc = 0, idx = INTRO_LINES.length;
                        for (let i = 0; i < INTRO_LINES.length; i++) {
                            acc += INTRO_DURATIONS[i];
                            if (el < acc) { idx = i; break; }
                        }
                        if (idx >= INTRO_LINES.length) {
                            phase = 'cycle';
                            maskGroup.visible = true;
                            lastFormedTime = t;
                            hideOnboardGuide();
                            questionEl.textContent = QUESTIONS[currentIndex] || '';
                            questionEl.classList.add('show');
                        } else if (idx !== introLineIndex) {
                            introLineIndex = idx;
                            questionEl.classList.remove('show');
                            setTimeout(() => {
                                questionEl.textContent = INTRO_LINES[idx];
                                questionEl.classList.add('show');
                            }, 350);
                        }
                    }
                } else {
                    if (!transition) {
                        if (t - lastFormedTime >= SWITCH_INTERVAL) {
                            questionEl.classList.remove('show');
                            transition = { phase: 'out', start: t, next: (currentIndex + 1) % maskAssets.length };
                        }
                    } else if (transition.phase === 'out') {
                        const p = (t - transition.start) / DISSOLVE_OUT;
                        u.uDissolve.value = Math.min(p, 1);
                        if (p >= 1) {
                            applyAsset(transition.next);
                            transition = { phase: 'in', start: t };
                        }
                    } else {
                        const p = (t - transition.start) / DISSOLVE_IN;
                        u.uDissolve.value = 1 - Math.min(p, 1);
                        if (p >= 1) {
                            transition = null;
                            lastFormedTime = t;
                            questionEl.textContent = QUESTIONS[currentIndex] || '';
                            questionEl.classList.add('show');
                        }
                    }
                }

                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
